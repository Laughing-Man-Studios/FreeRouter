# Auto-routing policy (M4). The presence of this block enables model = "free";
# there is no separate enable flag. Weights are relative and normalised by their
# total, so fractions, percentages and raw points all work.
routing:
  weights:
    quality: 0.60 # answer quality, the dominant objective (CONSTITUTION §2.4)
    tool_support: 0.30 # capability fit for the project's primary workload
    latency: 0.10 # deliberately the smallest factor (CONSTITUTION §2.5)
  latency_ceiling_ms: 5000 # above this, latency scores zero and stays eligible

models:
  - id: "google/gemini-3.5-flash-lite"
    provider: "google"
    provider_id: "gemini-3.5-flash-lite"
    capabilities:
      context_window:
        value: 1048576
        provenance: published
        # The input token limit. The provider states it separately from the
        # 65,536 output limit; the fit test adds reserved output to this figure,
        # so the input limit is the conservative reading (spec §2).
        source: "https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash-lite, input token limit, retrieved 2026-11-04"
      supports_streaming:
        value: true
        provenance: measured
        source: "T062 measurement, Google, 20/20 streamed, 2026-10-30"
      # The model supports function calling, image input and structured output.
      # All three are forwarded by both adapters and were verified here by live
      # measurement (M4 Batch 2, T081; M4 Batch 3, T083; M4 Batch 4, T084): tool calls,
      # json_object / json_schema, and base64 vision input.
      supports_tools:
        value: true
        provenance: measured
        source: "T081 measurement, Google, unary + second turn + streamed, 2026-11-19"
      supports_vision:
        value: true
        provenance: measured
        source: "T084 measurement, Google gemini-3.5-flash-lite, base64 inline, unary + streamed, 2026-11-21"
      supports_json_schema:
        value: true
        provenance: measured
        source: "T083 measurement, Google gemini-3.5-flash-lite, json_object + json_schema, unary + streamed, 2026-11-19"
    # Operator priors for auto-routing (spec §2, R2, ADR-0010).
    #
    # THESE ARE OPINIONS, NOT BENCHMARK RESULTS. Nothing in M4 observes, learns
    # or measures them; a future reader must not cite `quality: 75` as evidence.
    # Revisit them whenever a model is added or retired, and again when M5 adds
    # observed estimates beside the prior.
    #
    # quality: 75   -- a capable small model, deliberately not scored at the top
    #                  of the range, so adding a stronger model later ranks above
    #                  it without lowering this one.
    # latency_ms: 1200 -- a plausible free-tier response for a small model and
    #                  well under the 5000 ms ceiling. Above the ceiling a model
    #                  still scores (zero on latency) and stays eligible.
    # quality is 0-100; latency_ms is an expected response time.
    routing:
      quality: 75
      latency_ms: 1200
    fallback_models: []

# The Mistral adapter ships in M1 (Issue #7) and is selectable purely through
# configuration -- `core/config.py` and `api/routes.py` were deliberately left
# unmodified by Batch 2. It is NOT declared here by default, for one reason:
#
#   Every credential a model declares is REQUIRED. Adding the Mistral entry makes
#   MISTRAL_KEY_PRIMARY mandatory, and startup aborts without it -- by design
#   (CONSTITUTION 9.2, ADR-0002). That would mean a Google-only operator can no
#   longer start the router, which is a deployment-contract change nobody asked
#   for.
#
# To enable it, add the entry and supply the credential:
#
#   - id: "mistral/ministral-3b-2512"
#     provider: "mistral"
#     provider_id: "ministral-3b-2512"
#     capabilities:
#       context_window:
#         value: 262144
#         provenance: published
#         source: "https://docs.mistral.ai/models/ministral-3-3b-25-12, retrieved 2026-11-04"
#       supports_streaming:
#         value: true
#         provenance: measured
#         source: "T061 manual matrix, Mistral, 1 streamed request, 12 chunks, 2026-10-30"
#       # The model supports function calling, image input and structured output.
#       # All three are forwarded by this adapter and were verified by live
#       # measurement (M4 Batch 2, T081; M4 Batch 3, T083; M4 Batch 4, T085), same
#       # shape as the Google entry above: tool calls, json_object / json_schema,
#       # and base64 vision input.
#       supports_tools:
#         value: true
#         provenance: measured
#         source: "T081 measurement, Mistral, unary + second turn + streamed, 2026-11-19"
#       supports_vision:
#         value: true
#         provenance: measured
#         source: "T085 measurement, Mistral ministral-3b-2512, base64 inline, unary + streamed, 2026-11-21"
#       supports_json_schema:
#         value: true
#         provenance: measured
#         source: "T083 measurement, Mistral ministral-3b-2512, json_object + json_schema, unary + streamed, 2026-11-19"
#     routing:
#       # Opinions, not measurements -- see the note on the Google priors above.
#       quality: 70
#       latency_ms: 1500
#     fallback_models: []
#     # Measured free-tier limits (Issue #7, workspace console):
#     #   12.50 requests/second, 1,300,000 tokens/minute.
#     # Recorded as measured rather than published -- neither provider documents
#     # free-tier figures. See spec.md section 4.
#     #
#     # No daily (RPD) dimension is declared: Mistral's console shows no daily
#     # ceiling, and an unverified limit is omitted rather than guessed. Omitting
#     # it means "not enforced", which is a visible gap -- unlike declaring it
#     # unlimited, which would be a false guarantee.
#     quota:
#       - resource: "requests"
#         limit: 12.5
#         window_seconds: 1
#         provenance: "measured"
#       - resource: "tokens"
#         limit: 1300000
#         window_seconds: 60
#         provenance: "measured"
#
# WARNING: this file is baked into the image and the CI smoke test supplies only
# GOOGLE_KEY_PRIMARY. Adding a model here without also passing its credential in
# `.github/workflows/ci.yml` and `docker-compose.yml` will break the build. See
# tests/test_shipped_config.py for what is and is not covered by the test suite.