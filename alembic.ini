# Alembic configuration.
#
# The authoritative configuration is built in Python, by
# free_router.migrations.alembic_config(), which points script_location at this
# directory and sets the database URL from the same ROUTER_DB_PATH the engine
# uses. Doing it in code rather than here means the migration target cannot
# drift from the runtime target.
#
# `alembic.ini` exists so the Alembic CLI works for authoring revisions:
#
#     uv run alembic revision --autogenerate -m "describe the change"
#
# For that to work from the repository root, set the URL on the command line:
#
#     uv run alembic -c alembic.ini -x db=data/router.db revision --autogenerate
#
# or simply use the runner, which is what the application does:
#
#     from free_router.migrations import run_migrations
#     run_migrations("data/router.db")

[alembic]
script_location = src/free_router/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

# Overridden by alembic_config() at runtime, which also creates the parent
# directory. The CLI needs it to exist, so the placeholder is a bare filename
# that needs no directory.
sqlalchemy.url = sqlite:///router-scratch.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S