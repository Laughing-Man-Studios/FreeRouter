name: CI

# Gates every pull request. Each job mirrors a command a developer runs locally,
# so a green run means `make check` would pass. Nothing here needs a provider
# key: the test suite mocks the Gemini endpoint, so CI never spends quota.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main, M0]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref, so a force-push
  # does not leave several stale runs fighting over the runner queue.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"

      - name: Install Python and dependencies
        run: |
          uv python install 3.13
          uv sync --frozen --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        # Formatting is a separate step rather than a combined invocation so a
        # failure names which half disagreed.
        run: uv run ruff format --check .

  typecheck:
    name: Type Check (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"

      - name: Install Python and dependencies
        run: |
          uv python install 3.13
          uv sync --frozen --dev

      - name: mypy
        # Strict mode is set in pyproject.toml; the flag is repeated here so a
        # future config change cannot silently relax CI.
        run: uv run mypy --strict src/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"

      - name: Install Python and dependencies
        run: |
          uv python install 3.13
          uv sync --frozen --dev

      - name: pytest
        # No GEMINI_API_KEY is set. The suite must pass without one, which
        # proves it is fully mocked and cannot reach a provider.
        run: uv run pytest -v

      - name: Assert no provider credential is required
        if: success()
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY is set in CI; the test suite must not need one"
            exit 1
          fi
          echo "Confirmed: suite runs with no provider credential."

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Buildx is required for the cache mounts in the Dockerfile; the default
      # docker driver ignores them silently.
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          # Tags must be explicit. build-push-action otherwise names the loaded
          # image free-router:<ref-sha> from the checkout ref, which no later
          # step knows to look for.
          tags: free-router:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image contract
        run: |
          set -euo pipefail

          # A non-root image is a hard requirement (CONSTITUTION 3.2, spec 7).
          user="$(docker inspect free-router:ci --format '{{.Config.User}}')"
          if [ -z "$user" ]; then
            echo "::error::no USER set; the image would run as root"
            exit 1
          fi
          echo "Runs as user: $user"

          if [ "$user" = "0" ] || [ "$user" = "root" ]; then
            echo "::error::image is configured to run as root"
            exit 1
          fi

          # spec 7 requires python:3.13-slim and a healthcheck.
          health="$(docker inspect free-router:ci --format '{{json .Config.Healthcheck}}')"
          if [ "$health" = "null" ]; then
            echo "::error::no HEALTHCHECK defined"
            exit 1
          fi
          echo "Healthcheck present."

          if ! docker run --rm free-router:ci python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"; then
            echo "::error::runtime is not Python 3.13"
            exit 1
          fi

      - name: Smoke test the container
        run: |
          set -euo pipefail

          # A placeholder key: startup validates presence and format, never
          # authenticity, so this exercises the real startup path with no
          # provider access.
          docker run -d --name router -p 8000:8000 \
            -e GEMINI_API_KEY=ci-placeholder-key \
            free-router:ci

          # Poll rather than sleep a fixed amount, so a slow runner does not
          # produce a flaky failure.
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Container healthy after ${attempt}s."
              docker rm -f router
              exit 0
            fi
            sleep 1
          done

          echo "::error::container never became healthy"
          docker logs router
          docker rm -f router
          exit 1

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v16

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installed standalone rather than via `uv run pip-audit`, which would
      # require adding it to the project's dev dependencies to satisfy a
      # one-off CI check. It stays a separate tool.
      # Advisory, not a gate: a new CVE in a transitive dependency should be
      # visible in the log without blocking unrelated work. Treat a new finding
      # as a prompt to act, not as a red build.
      - name: Audit known vulnerabilities
        run: |
          python -m pip install --quiet pip-audit
          # pip-audit exits 1 on any finding, which would fail the job. The exit
          # code is captured and reported as a warning instead, so a new CVE is
          # visible without turning an unrelated PR red.
          if ! pip-audit --strict --progress-spinner=off; then
            echo "::warning::pip-audit reported findings; review and upgrade"
          fi