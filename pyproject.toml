[project]
name = "free-router"
version = "0.1.0"
description = "OpenAI-compatible routing proxy for free-tier LLM providers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "uvloop",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    "aiosqlite",
    "sqlalchemy",
    # `alembic` is deliberately absent until a second schema revision exists.
    # See specs/001-project-bootstrap/tasks.md (Batch 4, T017) and
    # docs/adr/0001-initial-technology-stack.md.
    #
    # `aiosqlite` is retained because CONSTITUTION 3.1 mandates an async driver
    # for the MVP. It is declared but not yet imported; db/engine.py still uses
    # a synchronous pysqlite engine. Converting it is tracked as Batch 4 (T016).
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/free_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() is declared in argument defaults by design.
"src/free_router/api/routes.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
